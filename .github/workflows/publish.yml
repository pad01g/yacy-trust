name: Publish
# After a merge to main: sign the bundle with the coordinator key, check it with YaCy's own parser, publish it on
# GitHub Pages (https://pad01g.github.io/yacy-trust/bundle.json). The key is a secret of the environment
# "coordinator", which only the main branch may use.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # the YaCy fork image used to check the bundle, pinned by digest
  YACY_IMAGE: ghcr.io/pad01g/yacy-improved-search@sha256:f149fef993a3eb37b3ac79cb5e3d56dfc65d17e869ebed0c36c4ff8d5e7dddbc

jobs:
  build:
    runs-on: ubuntu-latest
    environment: coordinator
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Only the current head of main is published
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch -q origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "::error::this run is not for the current head of main (a re-run of an old run would publish old state)"; exit 1; }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - run: node --no-warnings --test scripts/trust.test.ts
      - name: Sign the bundle
        env:
          COORDINATOR_KEY: ${{ secrets.COORDINATOR_KEY }}
        run: node --no-warnings scripts/trust.ts build site
      - name: YaCy accepts every statement of the bundle
        run: |
          docker run --rm -v "$PWD/site:/site:ro" --entrypoint sh "$YACY_IMAGE" -c \
            "java -cp '/opt/yacy_search_server/lib/*' net.yacy.peers.trust.TrustTool verify /site/bundle.json freeworld $(jq -r .pk coordinator.json)" | tee verify.txt
          accepted=$(sed -n 's/^\([0-9]*\) statements accepted.*/\1/p' verify.txt)
          total=$(jq '.envelopes | length' site/bundle.json)
          test "$accepted" = "$total" || { echo "::error::YaCy accepted $accepted of $total statements"; exit 1; }
      - name: Agent-readable files
        run: cp llms.txt site/llms.txt && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
