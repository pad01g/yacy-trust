name: Validate
# Pull requests: check the registry entries against the rules, the git history and the published bundle. No secrets here.
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the validation reads the history of operators/ and revoked/
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - run: node --no-warnings --test scripts/trust.test.ts
      - run: node --no-warnings scripts/trust.ts validate
